<!DOCTYPE html>
<!--
  ============================================================
  学术个人主页（博士申请用）
  Vue 3 + Vue Router（免构建版）
  ============================================================
  【使用说明】网站内容已按《我的简历信息.docx》填充完成。
  后续修改：各页面内容直接改本文件对应的 text/x-template 模板，
  论文条目在 js/pages.js 的 HomePage 组件 pubs 数组里增删。

  页面结构（仿 HugoBlox 混合模式）：
    /  首页（单页滚动）：
         Bio        → #bio      个人卡片 + 关于我（页面顶部）
         动态 News  → #news     最新动态（同页锚点）
         论文 Papers→ #papers   论文发表（同页锚点，带分类筛选）
       点导航按钮在首页内平滑滚动定位。
    独立路由页面（App Router 风格，各自单独存在）：
         /projects     项目   研究项目
         /experience   经历   教育与工作经历
         /awards       荣誉   获奖与荣誉
         /skills       技能   技能
         /contact      联系   联系方式

  各页面 HTML 在本文件下方的 <script type="text/x-template"> 中，
  论文数据在 js/pages.js 的 HomePage 组件里（数组形式，方便增删）。
  头像图片放在 assets/ 文件夹并命名为 avatar.jpg。

  注意：使用 hash 路由（URL 形如 index.html#/experience），
  无需服务器配置，部署到任意静态托管即可。
  ============================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>张冰 Ice Zhang · 学术主页</title>
  <meta name="description" content="张冰（Bing Zhang）个人学术主页：自然语言处理（谣言检测）、图神经网络、知识蒸馏、ROS 2 与边缘计算。河西学院人工智能学院助教，新疆大学计算机技术硕士。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== Vue 应用挂载点 ===================== -->
  <div id="app">

    <!-- ===================== 导航栏 ===================== -->
    <header class="navbar" id="navbar" :class="{ scrolled: scrolled }">
      <div class="container nav-inner">
        <router-link to="/" class="nav-logo" @click="closeMenu">张冰 <span class="nav-logo-en">Ice Zhang</span></router-link>

        <nav class="nav-links" id="navLinks" :class="{ open: menuOpen }">
          <!-- 首页内锚点：点击平滑滚动到对应区块 -->
          <a :class="{ active: onHome && activeSection === 'bio' }" @click="goSection('bio')">Bio</a>
          <a :class="{ active: onHome && activeSection === 'news' }" @click="goSection('news')">动态</a>
          <a :class="{ active: onHome && activeSection === 'papers' }" @click="goSection('papers')">论文</a>
          <!-- 独立路由页面 -->
          <router-link to="/projects" @click="closeMenu">项目</router-link>
          <router-link to="/experience" @click="closeMenu">经历</router-link>
          <router-link to="/awards" @click="closeMenu">荣誉</router-link>
          <router-link to="/skills" @click="closeMenu">技能</router-link>
          <router-link to="/contact" @click="closeMenu">联系</router-link>
        </nav>

        <div class="nav-actions">
          <button class="icon-btn" aria-label="切换深色模式" title="切换深色模式" @click="toggleTheme">
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button class="icon-btn nav-burger" aria-label="打开菜单" @click="menuOpen = !menuOpen">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- ===================== 路由页面出口 ===================== -->
    <main>
      <router-view></router-view>
    </main>

    <!-- ===================== 页脚 ===================== -->
    <footer class="footer">
      <div class="container footer-inner">
        <p>
          © {{ year }} <a href="https://github.com/icezhangGG" target="_blank" rel="noopener">icezhang</a> · 最后更新：{{ lastUpdate }}<br />
          This work is licensed under a <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">Creative Commons Attribution-NonCommercial 4.0 International License</a>.
        </p>
      </div>
    </footer>

  </div>

  <!-- 返回顶部 -->
  <button class="back-top" id="backTop" aria-label="返回顶部">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <!-- ============================================================
       页面模板区（每个 id 对应 js/pages.js 里的一个页面组件）
       修改页面内容直接改对应模板即可
       ============================================================ -->

      <!-- Bio：关于我 -->
      <section class="section">
        <div class="container">
          <h2 class="section-title">关于我</h2>
          <div class="prose">
            <p>本人本科及硕士阶段就读于新疆大学计算机技术专业，2021 年 9 月至 2024 年 7 月师从吾守尔·斯拉木教授，研究方向为自然语言处理与 ROS 2 系统开发。研究生期间围绕谣言检测与恶意软件检测开展研究，具备从数据构建、模型设计、对比实验到论文撰写的完整科研训练。</p>
            <p>在面向公共安全的多语种网络舆情监测项目中，我负责谣言检测模块，采用 BERT 预训练增强文本语义表征，在 GAT 网络前引入基于 Attention 的 GRU 模块进行降噪与特征优化，并结合对抗训练与自构建的 Double_CL 模块提升模型鲁棒性，相关成果以第一作者发表于二区 SCI 期刊，论文题目为 "Rumor Detection based on Attention Graph Adversarial Dual Contrast Learning"。在此基础上，我将知识蒸馏引入谣言检测任务，提出基于动态知识蒸馏的方法，在多教师框架中加入动态选择模块，于 Twitter16 数据集取得 94.6% 的准确率，并完成对比实验与消融实验。</p>
            <p>工程实践方面，我精通Codex、Claudecode、制作和使用各中skill。并在2024年初，独立完成基于 ESP32 的 Plen2 双足机器人开发，完成硬件改造、Arduino 控制程序与 Web 控制端设计，实现 Wi-Fi 控制下的行走、挥手、跳舞等动作。目前我在河西学院人工智能学院任助教，承担《文本数据挖掘》《JavaWeb 程序设计》《Python 程序设计》《人工智能通识》等课程教学，并开展张掖智慧农业项目，基于 NVIDIA Jetson Orin Nano Super 8GB 与 Ubuntu + ROS 2 构建无人机视觉感知与自主巡航系统，融合 SLAM、轻量化视觉检测模型与 TensorRT 边缘推理，实现病虫害自动检测、识别、定位与预警。</p>
          </div>

          <div class="interest-tags">
            <span class="tag">自然语言处理</span>
            <span class="tag">边缘AI与ROS 2自主系统</span>
            <span class="tag">图神经网络</span>
            <span class="tag">知识蒸馏</span>
            <span class="tag">对比学习</span>
            <span class="tag">嵌入式开发与AI</span>

      <!-- News：最新动态（首页锚点 #news） -->
      <section class="section section-alt" id="news">
        <div class="container">
          <h2 class="section-title">最新动态</h2>

            <li class="news-item reveal">
              <span class="news-date">2025.10</span>
              <span class="news-text">入职河西学院人工智能学院，任助教，讲授《文本数据挖掘》《JavaWeb 程序设计》等课程，并启动张掖智慧农业无人机巡检项目。</span>
            </li>
            <li class="news-item reveal">
              <span class="news-date">2024.07</span>
              <span class="news-text">硕士毕业于新疆大学，获评校级优秀毕业生。</span>
            </li>
            <li class="news-item reveal">
              <span class="news-date">2024.04</span>
              <span class="news-text">第一作者论文发表于 SCI 二区期刊 PLOS ONE。</span>
            </li>
            <li class="news-item reveal">
              <span class="news-date">2023</span>
              <span class="news-text">获软件著作权「基于图神经网络的谣言检测系统」（论文模型的部署实现）。</span>
            </li>
            <li class="news-item reveal">
              <span class="news-date">2022</span>
              <span class="news-text">获新疆维吾尔自治区奖学金（省级），并获评优秀研究生（校级）。</span>
            </li>
          </ul>

      <section class="section" id="papers">
        <div class="container">
          <h2 class="section-title">论文发表</h2>

          <div class="pub-filters">
            <button v-for="f in filters" :key="f.value" class="filter-btn"
                    :class="{ active: filter === f.value }" @click="filter = f.value">
              {{ f.label }}
            </button>
          </div>

          <div class="pub-list">
            <article v-for="(pub, i) in filteredPubs" :key="i" class="pub-item reveal">
              <div class="pub-badge">{{ pub.badge }}</div>
              <div class="pub-body">
                <h3 class="pub-title">{{ pub.title }}</h3>
                <p class="pub-authors" v-html="pub.authors"></p>
                <p class="pub-venue"><em>{{ pub.venue }}</em>{{ pub.note }}</p>
                <div class="pub-links">
                  <a v-for="(link, j) in pub.links" :key="j" :href="link.url" class="pub-link">{{ link.label }}</a>
                </div>
                <p v-if="pub.abs" class="pub-abs">{{ pub.abs }}</p>
              </div>
            </article>
          </div>
        </div>

  <!-- ========== 独立页面：Projects 研究项目 ========== -->
  <script type="text/x-template" id="tpl-projects">
    <section class="section page-section">
      <div class="container">
        <h2 class="section-title">研究项目</h2>
        <div class="card-grid">

          <article class="card reveal">
            <div class="card-thumb" style="background: linear-gradient(135deg,#3b82f6,#06b6d4);">ML</div>
            <div class="card-body">
              <h3 class="card-title">恶意软件检测研究</h3>
              <p class="card-text">2021.09 – 2022.09 · 新疆大学。基于 Mark Stamp 教授实验室提供的恶意软件数据集（20 个恶意家族、约 50 万个可执行样本），对比 CNN、RNN、LSTM、GRU、Stacked、ResNet152 与 VGG-19 等主流模型，并引入 ViT 预训练表征与图神经网络进行学习，最终检测准确率达到 92%。</p>
              <div class="card-tags"><span>ViT</span><span>图神经网络</span><span>CNN/LSTM/GRU</span><span>ResNet/VGG</span></div>
            </div>
          </article>

          <article class="card reveal">
            <div class="card-thumb" style="background: linear-gradient(135deg,#8b5cf6,#ec4899);">NLP</div>
            <div class="card-body">
              <h3 class="card-title">面向公共安全的多语种网络舆情监测系统</h3>
              <p class="card-text">2022.09 – 2023.08 · 新疆大学。负责谣言检测模块研究：采用 BERT 预训练增强文本语义表征，在 GAT 网络前引入基于 Attention 的 GRU 模块进行降噪与特征优化，结合对抗训练与自构建的 Double_CL 双对比学习模块提升模型鲁棒性，达到 SOTA 性能。相关成果以第一作者发表于二区 SCI 期刊。</p>
              <div class="card-tags"><span>BERT</span><span>图注意力网络 GAT</span><span>对抗训练</span><span>双对比学习</span></div>
              <div class="card-links"><a href="https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0290291" target="_blank" rel="noopener">论文 →</a></div>
            </div>
          </article>

          <article class="card reveal">
            <div class="card-thumb" style="background: linear-gradient(135deg,#06b6d4,#10b981);">KD</div>
            <div class="card-body">
              <h3 class="card-title">基于动态知识蒸馏的谣言检测研究</h3>
              <p class="card-text">2023.08 – 2024.01 · 新疆大学。在前期 SCI 论文基础上将知识蒸馏（KD）引入谣言检测任务，在多教师知识蒸馏框架中增加动态选择模块，在每个 batch 下动态选择当前最优教师模型进行知识传递。所提方法在 Twitter16 数据集上取得 94.6% 的准确率，并完成对比实验与消融实验。</p>
              <div class="card-tags"><span>知识蒸馏</span><span>多教师蒸馏</span><span>动态选择</span><span>Twitter16</span></div>
            </div>
          </article>

          <article class="card reveal">
            <div class="card-thumb" style="background: linear-gradient(135deg,#f59e0b,#f97316);">BOT</div>
            <div class="card-body">
